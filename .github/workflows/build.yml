name: Build iOS App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.0.app
      - name: Build IPA
        run: xcodebuild -project HapticPlayer.xcodeproj -scheme HapticPlayer -archivePath HapticPlayer.xcarchive archive
