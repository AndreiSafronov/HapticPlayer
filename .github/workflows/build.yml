name: Build HapticPlayer (.ipa)
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Create Structure
        run: mkdir -p Payload

      - name: Compile App Archive
        run: |
          xcodebuild archive \
            -project HapticPlayer.xcodeproj \
            -scheme HapticPlayer \
            -destination 'generic/platform=iOS' \
            -archivePath HapticPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Application Bundle
        run: |
          cp -r HapticPlayer.xcarchive/Products/Applications/HapticPlayer.app Payload/
          zip -r HapticPlayer.ipa Payload

      - name: Upload IPAs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HapticPlayer-Signed-IPA
          path: HapticPlayer.ipa
