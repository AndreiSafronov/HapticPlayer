name: Build HapticPlayer (.ipa)
on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15 # Upgraded from macos-14 to support Xcode 16+
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.0
        run: sudo xcode-select -s /Applications/Xcode_16.0.app # Fixed: Matches format 77 requirement

      - name: Create Structure
        run: mkdir -p Payload

      - name: Compile App Binary
        run: |
          xcodebuild build \
            -project HapticPlayer.xcodeproj \
            -scheme HapticPlayer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Application Bundle
        run: |
          cp -r build/Build/Products/Release-iphoneos/HapticPlayer.app Payload/
          zip -r HapticPlayer.ipa Payload

      - name: Upload IPAs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HapticPlayer-Signed-IPA
          path: HapticPlayer.ipa
