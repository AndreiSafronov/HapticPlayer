      - name: Compile and Archive App
        run: |
          xcodebuild archive \
            -project HapticPlayer.xcodeproj \
            -scheme HapticPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/HapticPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Application Bundle
        run: |
          mkdir -p Payload
          cp -r build/HapticPlayer.xcarchive/Products/Applications/HapticPlayer.app Payload/
          zip -r HapticPlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HapticPlayer-IPA
          path: HapticPlayer.ipa
