name: Build HapticPlayer (.ipa)

on: 
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_16.app || true

      - name: Clean Output
        run: rm -rf build Payload HapticPlayer.ipa

      - name: Compile and Archive App
        run: |
          xcodebuild archive \
            -project HapticPlayer.xcodeproj \
            -scheme HapticPlayer \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/HapticPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package Application Bundle
        run: |
          mkdir -p Payload
          cp -r build/HapticPlayer.xcarchive/Products/Applications/HapticPlayer.app Payload/
          zip -r HapticPlayer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HapticPlayer-IPA
          path: HapticPlayer.ipa
